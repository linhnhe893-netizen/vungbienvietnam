<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Mô Hình Các Vùng Biển &amp; Thềm Lục Địa Việt Nam</title>
    <!-- Tải Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phông chữ Inter chuẩn hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        ocean: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        marine: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.65); }
            70% { box-shadow: 0 0 0 11px rgba(5, 150, 105, 0); }
            100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
        }
        .hotspot-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease;
            transform: translate(-50%, -50%);
            touch-action: manipulation;
        }
        .hotspot-btn:hover { transform: translate(-50%, -50%) scale(1.16); z-index: 30; }
        .hotspot-btn.active {
            background-color: #047857;
            border-color: #fde047;
            transform: translate(-50%, -50%) scale(1.22);
            animation: pulseRing 2s infinite;
            z-index: 35;
        }
        .map-viewport { touch-action: none; user-select: none; -webkit-user-select: none; }
        .fade-slide-up { animation: fadeSlideUp 0.28s ease-out forwards; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#f3f7f6] text-slate-800 antialiased min-h-screen pb-10">
    <div class="max-w-3xl mx-auto px-3 sm:px-5 pt-3 sm:pt-5 space-y-3.5">
        <header class="bg-white rounded-2xl px-4 py-2.5 shadow-xs border border-slate-200/80 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
                <span id="top-badge-num" class="w-7 h-7 rounded-full bg-ocean-100 text-ocean-800 font-bold text-xs flex items-center justify-center flex-shrink-0">01</span>
                <h1 id="top-badge-title" class="font-bold text-sm sm:text-base text-slate-800 truncate">Nội thủy</h1>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-[11px] font-medium text-slate-500 hidden sm:inline">Luật Biển VN 2012</span>
                <span class="w-2.5 h-2.5 rounded-full bg-ocean-500 animate-pulse"></span>
            </div>
        </header>

        <section class="bg-white rounded-3xl p-3 sm:p-4 shadow-sm border border-slate-200/80 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="bg-ocean-50/90 border border-ocean-200/70 rounded-2xl px-3.5 py-2">
                    <h2 class="text-xs sm:text-sm font-extrabold text-ocean-900 uppercase tracking-wide leading-tight">MÔ HÌNH CÁC VÙNG BIỂN VIỆT NAM</h2>
                    <p class="text-[11px] text-ocean-700 font-medium mt-0.5">Chạm vào các số (1–7) trên sa bàn để xem hồ sơ</p>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200/80 rounded-2xl p-1">
                    <button id="btn-zoom-out" class="w-8 h-8 rounded-xl bg-white hover:bg-ocean-50 border border-slate-200 flex items-center justify-center font-bold text-base cursor-pointer">−</button>
                    <span id="zoom-level-text" class="px-2 text-xs font-bold text-slate-700 min-w-[44px] text-center">100%</span>
                    <button id="btn-zoom-in" class="w-8 h-8 rounded-xl bg-white hover:bg-ocean-50 border border-slate-200 flex items-center justify-center font-bold text-base cursor-pointer">+</button>
                    <button id="btn-zoom-reset" class="w-8 h-8 rounded-xl bg-white hover:bg-ocean-50 border border-slate-200 flex items-center justify-center cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </button>
                </div>
            </div>

            <div id="map-viewport" class="map-viewport relative w-full aspect-[4/3] sm:aspect-[16/11] bg-[#e7e5e0] rounded-2xl overflow-hidden border border-slate-200/90 cursor-grab">
                <div id="map-canvas" class="w-full h-full relative origin-center transition-transform duration-150 ease-out">
                    <svg id="default-saban-svg" viewBox="0 0 900 620" class="w-full h-full object-cover select-none pointer-events-none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgWallGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ebe9e4"/><stop offset="100%" stop-color="#bdb5a7"/></linearGradient>
                            <linearGradient id="waterSurfaceGrad" x1="0" y1="0" x2="1" y2="0.15"><stop offset="0%" stop-color="#8be3dc"/><stop offset="100%" stop-color="#287bb8"/></linearGradient>
                            <linearGradient id="waterFrontCutGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5cc5de" stop-opacity="0.88"/><stop offset="100%" stop-color="#1d6596" stop-opacity="0.96"/></linearGradient>
                            <linearGradient id="landTopGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4c7c34"/><stop offset="100%" stop-color="#c2b280"/></linearGradient>
                            <linearGradient id="shelfRockGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a88c68"/><stop offset="100%" stop-color="#3b2f24"/></linearGradient>
                        </defs>
                        <rect width="900" height="620" fill="url(#bgWallGrad)"/>
                        <polygon points="35,445 865,365 885,595 35,620" fill="#e5e0d8" stroke="#c8c0b4" stroke-width="2"/>
                        <polygon points="210,235 770,185 845,320 265,415" fill="url(#waterSurfaceGrad)"/>
                        <polygon points="65,248 228,233 288,262 252,302 276,342 246,385 268,415 162,438" fill="url(#landTopGrad)"/>
                        <polygon points="265,415 L365,398 L450,384 L538,370 L775,332 L845,320 L845,382 L775,394 L538,434 L450,450 L365,465 L265,482 Z" fill="url(#waterFrontCutGrad)"/>
                        <polygon points="65,248 162,438 162,568 65,365" fill="#47392c"/>
                        <path d="M162,454 L265,496 Q335,510 385,466 Q435,492 538,448 L775,408 L845,395 L845,442 L775,455 L538,498 L385,526 L265,548 L162,568 Z" fill="url(#shelfRockGrad)"/>
                        <text x="465" y="492" transform="rotate(-10 465,492)" fill="#fef08a" font-family="Inter, sans-serif" font-weight="800" font-size="22" letter-spacing="8" text-anchor="middle">THỀM LỤC ĐỊA</text>
                    </svg>
                    <!-- Hotspots -->
                    <button data-id="1" style="top: 49%; left: 31%;" class="hotspot-btn active absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">1</button>
                    <button data-id="2" style="top: 44%; left: 37.5%;" class="hotspot-btn absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">2</button>
                    <button data-id="3" style="top: 47%; left: 43.5%;" class="hotspot-btn absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">3</button>
                    <button data-id="4" style="top: 45%; left: 52%;" class="hotspot-btn absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">4</button>
                    <button data-id="5" style="top: 43%; left: 67%;" class="hotspot-btn absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">5</button>
                    <button data-id="6" style="top: 73%; left: 51%;" class="hotspot-btn absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">6</button>
                    <button data-id="7" style="top: 33%; left: 86%;" class="hotspot-btn absolute w-7 h-7 rounded-full bg-ocean-600 text-white font-extrabold text-xs border-2 border-white shadow-md flex items-center justify-center cursor-pointer z-20">7</button>
                </div>
            </div>
        </section>

        <!-- Thẻ Hồ Sơ -->
        <section id="profile-card" class="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-4 fade-slide-up">
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <span id="profile-index" class="text-xs font-extrabold text-ocean-700 uppercase">HỒ SƠ VÙNG BIỂN • 01 / 07</span>
                    <span id="profile-group-badge" class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">Chủ quyền hoàn toàn</span>
                </div>
                <h3 id="profile-title" class="text-xl sm:text-2xl font-extrabold text-slate-900">Nội thủy</h3>
                <p id="profile-desc" class="text-sm sm:text-[15px] text-slate-600 leading-relaxed">Vùng nước tiếp giáp với bờ biển, ở phía trong đường cơ sở và là bộ phận lãnh thổ của Việt Nam.</p>
            </div>
            <div id="profile-tags" class="flex flex-wrap gap-2">
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-ocean-50 text-ocean-800 border border-ocean-200">Chủ quyền hoàn toàn</span>
            </div>
        </section>
    </div>

    <script>
        const marineZonesData = [
            { id: 1, numStr: "01", title: "Nội thủy", groupName: "Chủ quyền hoàn toàn", desc: "Vùng nước tiếp giáp với bờ biển, ở phía trong đường cơ sở và là bộ phận lãnh thổ của Việt Nam.", tags: ["Chủ quyền hoàn toàn", "Phía trong đường cơ sở"] },
            { id: 2, numStr: "02", title: "Đường cơ sở", groupName: "Chủ quyền hoàn toàn", desc: "Đường ranh giới pháp lý cơ bản dùng làm mốc để tính chiều rộng lãnh hải và các vùng biển khác của Việt Nam.", tags: ["11 điểm tọa độ chuẩn", "Tuyên bố năm 1982"] },
            { id: 3, numStr: "03", title: "Lãnh hải", groupName: "Chủ quyền hoàn toàn", desc: "Vùng biển thuộc chủ quyền quốc gia trên biển, có chiều rộng 12 hải lý tính từ đường cơ sở ra phía biển.", tags: ["Rộng 12 hải lý", "Biên giới quốc gia trên biển"] },
            { id: 4, numStr: "04", title: "Vùng tiếp giáp lãnh hải", groupName: "Quyền chủ quyền", desc: "Vùng biển tiếp liền và nằm ngoài lãnh hải Việt Nam, có chiều rộng 12 hải lý tính từ ranh giới ngoài lãnh hải.", tags: ["Rộng 12 hải lý", "Kiểm soát hải quan & y tế"] },
            { id: 5, numStr: "05", title: "Vùng đặc quyền kinh tế (EEZ)", groupName: "Quyền chủ quyền", desc: "Vùng biển rộng 200 hải lý tính từ đường cơ sở, nơi Việt Nam có quyền đặc quyền khai thác tài nguyên.", tags: ["Rộng 200 hải lý", "Độc quyền khai thác tài nguyên"] },
            { id: 6, numStr: "06", title: "Thềm lục địa", groupName: "Đáy biển & Lòng đất", desc: "Phần kéo dài tự nhiên của lục địa mở rộng ra ngoài lãnh hải đến bờ ngoài rìa lục địa hoặc 200-350 hải lý.", tags: ["Đáy biển & lòng đất", "Tối thiểu 200 hải lý"] },
            { id: 7, numStr: "07", title: "Vùng biển quốc tế", groupName: "Tự do biển cả", desc: "Tất cả các vùng biển nằm ngoài vùng đặc quyền kinh tế, để ngỏ cho mọi quốc gia sử dụng vì mục đích hòa bình.", tags: ["Ngoài mốc 200 hải lý", "Tự do hàng hải"] }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const hotspotBtns = document.querySelectorAll('.hotspot-btn');
            const topBadgeNum = document.getElementById('top-badge-num');
            const topBadgeTitle = document.getElementById('top-badge-title');
            const profileIndex = document.getElementById('profile-index');
            const profileTitle = document.getElementById('profile-title');
            const profileDesc = document.getElementById('profile-desc');
            const profileTags = document.getElementById('profile-tags');
            const profileGroupBadge = document.getElementById('profile-group-badge');

            function selectZone(id) {
                const zone = marineZonesData.find(item => item.id === Number(id));
                if (!zone) return;

                topBadgeNum.textContent = zone.numStr;
                topBadgeTitle.textContent = zone.title;
                profileIndex.textContent = `HỒ SƠ VÙNG BIỂN • ${zone.numStr} / 07`;
                profileTitle.textContent = zone.title;
                profileDesc.textContent = zone.desc;
                profileGroupBadge.textContent = zone.groupName;

                profileTags.innerHTML = zone.tags.map(tag => 
                    `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-ocean-50 text-ocean-800 border border-ocean-200">${tag}</span>`
                ).join('');

                hotspotBtns.forEach(btn => {
                    if (Number(btn.dataset.id) === zone.id) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }

            hotspotBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectZone(btn.dataset.id);
                });
            });

            // Zoom logic cơ bản
            let scale = 1;
            const canvas = document.getElementById('map-canvas');
            document.getElementById('btn-zoom-in').addEventListener('click', () => { scale = Math.min(2.5, scale + 0.3); canvas.style.transform = `scale(${scale})`; document.getElementById('zoom-level-text').textContent = Math.round(scale * 100) + '%'; });
            document.getElementById('btn-zoom-out').addEventListener('click', () => { scale = Math.max(1, scale - 0.3); canvas.style.transform = `scale(${scale})`; document.getElementById('zoom-level-text').textContent = Math.round(scale * 100) + '%'; });
            document.getElementById('btn-zoom-reset').addEventListener('click', () => { scale = 1; canvas.style.transform = `scale(1)`; document.getElementById('zoom-level-text').textContent = '100%'; });

            selectZone(1);
        });
    </script>
</body>
</html>
